<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Vanishing Gallery — an art heist on Janelle's tiny planet</title>
<link rel="preload" href="./fonts/caveat-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/patrick-hand-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* hand-lettering, bundled with the game (OFL fonts: Caveat, Patrick Hand) */
  @font-face { font-family: 'Caveat'; font-weight: 700; font-display: swap; src: url(./fonts/caveat-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Caveat'; font-weight: 600; font-display: swap; src: url(./fonts/caveat-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Patrick Hand'; font-weight: 400; font-display: swap; src: url(./fonts/patrick-hand-latin-400-normal.woff2) format('woff2'); }
  :root {
    --paper: #f6efdf; --paper2: #efe4cc; --ink: #2a2230; --ink2: #5a4e5e; --accent: #e8604c; --gold: #e4b84f;
    --sketch: 255px 14px 225px 16px / 16px 225px 14px 255px;   /* a hand-drawn box */
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3ead7; font-family: 'Patrick Hand', 'Comic Sans MS', cursive; color: var(--ink); }
  canvas { display: block; touch-action: none; }
  body.touch { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }   /* no double-tap zoom / text selection on phones */
  .ui { position: fixed; z-index: 10; }
  .sk { background: var(--paper); border: 2.5px solid var(--ink); border-radius: var(--sketch); box-shadow: 3px 4px 0 rgba(42,34,48,0.85); }
  button.sk { font: inherit; font-size: 20px; color: var(--ink); padding: 8px 22px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
  button.sk:hover { transform: translate(-1px,-1px) rotate(-0.6deg); box-shadow: 5px 6px 0 rgba(42,34,48,0.85); }
  button.sk:active { transform: translate(2px,3px); box-shadow: 1px 1px 0 rgba(42,34,48,0.85); }
  .hide { opacity: 0 !important; pointer-events: none !important; }
  .fade { transition: opacity .6s ease; }

  /* title page */
  #title { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 7vh; gap: 4px; text-align: center; pointer-events: none; }
  #title p, #title .by { background: rgba(246,239,223,.82); border-radius: var(--sketch); padding: 2px 14px; }
  #title h1 { font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(54px, 11vw, 132px); line-height: .9; margin: 0;
    color: var(--ink); text-shadow: 3px 3px 0 var(--paper); transform: rotate(-2deg); }
  #title h1 span { color: var(--accent); }
  #title p { font-size: clamp(18px, 2.6vw, 26px); margin: 6px 16px; color: var(--ink2); }
  #title .by { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  #title button { pointer-events: auto; margin-top: auto; margin-bottom: max(16vh, 70px); font-size: 26px; padding: 10px 34px; background: var(--gold); transform: rotate(-1.5deg); }

  /* cold open */
  .bar { left: 0; right: 0; height: 11vh; background: #17121b; transition: transform .8s ease; z-index: 30; }
  #barT { top: 0; transform: translateY(-100%); } #barB { bottom: 0; transform: translateY(100%); }
  body.cine #barT, body.cine #barB { transform: none; }
  #caption { left: 50%; bottom: 14vh; transform: translateX(-50%); font-family: 'Caveat', cursive; font-size: clamp(26px, 4vw, 40px); color: #f6efdf; z-index: 31; text-shadow: 0 2px 0 #17121b; white-space: nowrap; }
  #skip { right: 18px; bottom: calc(11vh + 14px); z-index: 31; font-size: 16px; padding: 4px 14px; }

  /* hud */
  #hud { left: 14px; top: 12px; width: min(330px, 46vw); padding: 8px 14px 6px; transform: rotate(-0.4deg); }
  #hud b { font-family: 'Caveat', cursive; font-size: 28px; display: block; line-height: 1; padding-right: 30px; }
  #hud b span { font-size: 0.78em; opacity: 0.7; white-space: nowrap; }
  /* the case board folds down to its title + the current step (a little tab on its corner) */
  #caseTog { position: absolute; right: 7px; top: 7px; width: 26px; height: 24px; border: 2px solid var(--ink); border-radius: 8px;
    background: var(--gold); font: 700 18px/1 'Patrick Hand', cursive; color: var(--ink); cursor: pointer; padding: 0; box-shadow: 1px 2px 0 rgba(42,34,48,.6); }
  #caseTog:hover { background: #f0c95e; }
  #caseMini { display: none; font-size: 16px; color: var(--ink2); margin-top: 2px; }
  #hud.min #case { display: none; } #hud.min #caseMini { display: block; } #hud.min { width: auto; max-width: min(330px, 46vw); padding-right: 40px; }
  #case .st { font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700; margin: 6px 0 1px; }
  #case .st.go { color: var(--accent); }
  #case .cr { font-size: 16px; line-height: 1.25; padding: 2px 6px; margin: 0 -6px; border-radius: 8px; cursor: pointer; }
  #case .cr:hover { background: rgba(228,184,79,.25); }
  #case .cr.on { background: rgba(232,96,76,.16); font-weight: 600; }
  #case .cr.done { opacity: .55; text-decoration: line-through; text-decoration-thickness: 1.5px; }
  #case .cr i { font-style: normal; display: inline-block; width: 14px; color: var(--accent); font-weight: 700; }
  #case .ct { float: right; color: var(--ink2); }
  #case p { font-size: 15px; line-height: 1.25; margin: 4px 0; color: var(--ink2); }
  #case p.soft { font-size: 13px; opacity: .8; }
  #case kbd, #hint kbd { font-family: inherit; font-size: .9em; border: 1.5px solid var(--ink); border-radius: 5px; padding: 0 5px; background: var(--gold); color: var(--ink); }
  #way { left: 0; top: 0; z-index: 9; pointer-events: none; transition: opacity .3s ease; will-change: transform; }
  #way svg { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); filter: drop-shadow(2px 3px 0 rgba(42,34,48,.5)); animation: wayBob 1.1s ease-in-out infinite; }
  #way span { position: absolute; left: 0; top: 26px; transform: translateX(-50%); white-space: nowrap; font-size: 17px; background: var(--paper); border: 2px solid var(--ink); border-radius: var(--sketch); padding: 0 8px; }
  @keyframes wayBob { 50% { margin-top: -5px; } }
  /* someone the car just met */
  #bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
  .bub { position: absolute; left: 0; top: 0; white-space: nowrap; padding: 0 14px 2px; font-family: 'Caveat', cursive; font-weight: 700; font-size: 30px; will-change: transform; }
  .bub.yell { font-size: 34px; color: var(--accent); }
  .bub.wail { font-size: 42px; letter-spacing: .02em; }
  .bub.grumble { font-family: 'Patrick Hand', cursive; font-weight: 400; font-size: 19px; padding: 2px 12px; }
  #nbBtn { right: 16px; top: 14px; font-size: 20px; }
  #nbBtn i { font-style: normal; display: inline-block; min-width: 22px; margin-left: 6px; background: var(--accent); color: #fff; border-radius: 50%; text-align: center; font-size: 15px; }
  #hint { left: 14px; bottom: 14px; font-size: 15px; padding: 4px 12px; max-width: calc(100vw - 200px); line-height: 1.6; opacity: .92; }
  #prompt { left: 50%; bottom: 74px; transform: translateX(-50%) rotate(-1deg); font-size: 22px; padding: 6px 18px; background: #fffaf0; }
  #prompt kbd { font-family: inherit; border: 2px solid var(--ink); border-radius: 6px; padding: 0 7px; margin-right: 6px; background: var(--gold); }

  /* a found thing: a sketchbook card */
  #card { left: 50%; top: 50%; width: min(440px, 88vw); transform: translate(-50%, -50%) rotate(-1.2deg); padding: 20px 24px 18px; z-index: 20; }
  img.pt { width: 76px; height: 76px; display: block; }
  img.pt.sm { width: 40px; height: 40px; } img.pt.xs { width: 28px; height: 28px; display: inline-block; vertical-align: middle; margin: -4px 2px -4px -6px; }
  #card .ic { float: left; margin: 0 14px 4px -4px; } #card .ic img.pt { width: 96px; height: 96px; }
  #card h3 { font-family: 'Caveat', cursive; font-size: 34px; margin: 0 0 6px; }
  #card p { font-size: 20px; line-height: 1.35; margin: 0 0 12px; }
  #card .note { font-size: 15px; color: var(--ink2); }
  /* the cargo ticket: the crumpled slip, dropped onto the card */
  #card .tkt { margin: -6px -8px 6px; transform-origin: 50% 40%; animation: tktDrop .55s cubic-bezier(.2,1.4,.4,1) both; filter: drop-shadow(1px 2px 0 rgba(42,34,48,.15)); }
  @keyframes tktDrop { 0% { opacity: 0; transform: translateY(-40px) rotate(-14deg) scale(.8); } 100% { opacity: 1; transform: rotate(-3deg); } }
  @media (prefers-reduced-motion: reduce) { #card .tkt { animation: none; transform: rotate(-3deg); } }
  #card button { float: right; }

  /* someone talks */
  #talk { left: 50%; bottom: 22px; width: min(640px, 92vw); transform: translateX(-50%); padding: 14px 20px; z-index: 20; display: flex; gap: 14px; align-items: flex-start; }
  #talk .face { flex: 0 0 auto; margin: -6px 0 -6px -6px; }
  #talk b { font-family: 'Caveat', cursive; font-size: 28px; display: block; line-height: 1; margin-bottom: 4px; }
  #talk p { font-size: 20px; margin: 0 0 8px; line-height: 1.32; }
  #talk .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  /* the notebook: lined paper */
  #nb { left: 50%; top: 50%; width: min(620px, 94vw); max-height: 82vh; max-height: 82dvh; overflow: auto; transform: translate(-50%, -50%) rotate(0.6deg); padding: 18px 26px 22px; z-index: 25;
    background-image: repeating-linear-gradient(transparent 0 31px, rgba(120,140,170,.35) 31px 32px); background-color: var(--paper); }
  #nb h2 { font-family: 'Caveat', cursive; font-size: 40px; margin: 0 0 6px; }
  #nb .x { float: right; font-size: 18px; padding: 2px 12px; }
  #nb ul { list-style: none; padding: 0; margin: 4px 0 14px; }
  #nb li { font-size: 19px; line-height: 1.4; margin: 6px 0; display: flex; gap: 10px; }
  #nb li .i { flex: 0 0 auto; }
  #nb li.pick { cursor: pointer; border-radius: 8px; padding: 2px 6px; }
  #nb li.pick.on { background: rgba(228,184,79,.45); }
  #nb .empty { color: var(--ink2); font-style: italic; }
  #nb .who { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 12px; }
  #nb .who button.on { background: var(--gold); }
  #nb .verdict { font-size: 20px; padding: 10px 14px; margin-top: 10px; }

  /* the phone: a sketched handset */
  #phone { right: 22px; bottom: 22px; width: min(320px, 86vw); padding: 14px 16px 16px; z-index: 22; transform: rotate(1.4deg); }
  #phone .hd { font-size: 16px; color: var(--ink2); border-bottom: 2px dashed rgba(42,34,48,.3); padding-bottom: 6px; margin-bottom: 8px; }
  #phone .msg { background: #fffaf0; border: 2px solid var(--ink); border-radius: 14px 14px 14px 4px; padding: 6px 10px; margin: 6px 0; font-size: 18px; line-height: 1.3; }
  #phone button { margin-top: 8px; width: 100%; }

  /* the loader: a pencil doodles the case on a scrap of paper while another is sharpened, shavings
     flying. Only transform/opacity animate, so it keeps moving while the world is being built. */
  #loader { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: 'Caveat', cursive; font-weight: 700; font-size: 34px; color: #2a2230; background: #f3ead7; z-index: 50; }
  #loader.hide, #loader.hide * { animation-play-state: paused !important; }
  .ld-stage { position: relative; width: 440px; height: 230px; }
  .ld-stage div { position: absolute; will-change: transform, opacity; }
  .ld-paper { left: 128px; top: 8px; width: 300px; height: 200px; background: #fffaf0; border: 2.5px solid #2a2230; border-radius: 6px 14px 8px 12px / 12px 6px 14px 8px; box-shadow: 3px 4px 0 rgba(42,34,48,.85); transform: rotate(-1.6deg); }
  .ld-paper svg { position: absolute; inset: 0; overflow: visible; }
  .ld-s { inset: 0; opacity: 0; animation: 8.0s linear infinite; }
  .ld-s path { fill: none; stroke: #2a2230; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ld-pp { left: 0; top: 0; animation: ld-pen 8.0s ease-in-out infinite; }
  .ld-pen { left: -13px; top: -128px; transform-origin: 13px 128px; animation: ld-wig .22s ease-in-out infinite alternate; }
  @keyframes ld-wig { from { transform: rotate(28deg); } to { transform: rotate(34deg); } }

  .ld-body { left: 14px; top: 0; width: 70px; height: 22px; background: #e1b95c; border: 2.5px solid #2a2230; border-right: 0; border-radius: 3px 0 0 3px; overflow: hidden; box-sizing: border-box; }

  @keyframes ld-roll { from { transform: translateY(-6px); } to { transform: translateY(18px); } }
