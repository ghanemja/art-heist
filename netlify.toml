[build]
  publish = "."
  # Gate builds on the main character: a missing/invalid critic.glb fails the
  # build so it can't ship empty. (Runs on git-connected builds and on
  # `netlify deploy --build`; the manual path is guarded by ./deploy.sh.)
  command = "node scripts/validate-critic.mjs"

# v2 lives in its own folder; force the trailing slash so its relative ./js paths resolve
[[redirects]]
  from = "/v2"
  to = "/v2/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.jsx"
  [headers.values]
    Content-Type = "text/babel; charset=utf-8"

[[headers]]
  for = "/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
