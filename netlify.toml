[build]
  publish = "."
  # Netlify deploys every push to main. Gate it: a missing/invalid critic.glb or real-model
  # asset fails the build so it can't ship empty, and every js/ module must be in
  # index.html's import map with main.js's cache token (scripts/check-modules.mjs). (Runs on git-connected builds and on
  # `netlify deploy --build`; the manual path is guarded by ./deploy.sh.)
  command = "node scripts/validate-critic.mjs && node scripts/validate-assets.mjs && node scripts/check-modules.mjs"

# the game used to live at /v2/ — it's the main app at / now
[[redirects]]
  from = "/v2"
  to = "/"
  status = 301

[[redirects]]
  from = "/v2/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.jsx"
  [headers.values]
    Content-Type = "text/babel; charset=utf-8"

[[headers]]
  for = "/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
